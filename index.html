<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDFPlay - Free Online PDF Tools | No Upload</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f8fafc;color:#1e293b}
header{background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:100;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:22px}.logo span{color:#6366f1}
.marquee{background:#111827;color:#fff;font-size:13px;padding:8px 0;overflow:hidden;white-space:nowrap}
.marquee span{display:inline-block;animation:scroll 20s linear infinite;padding-left:100%}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.container{max-width:1100px;margin:0 auto;padding:30px 20px}
.hero{text-align:center;margin:20px 0 30px}.hero h1{font-size:38px;font-weight:800}
.hero h1 .grad{background:linear-gradient(90deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;cursor:pointer;transition:.2s}
.card:hover{border-color:#6366f1;transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,.12)}
.card .icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:700}.card p{font-size:13px;color:#64748b}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal.active{display:flex}
.modal-box{background:#fff;width:100%;max-width:560px;border-radius:16px;overflow:hidden}
.modal-head{padding:18px 20px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.close{border:0;background:#f1f5f9;width:32px;height:32px;border-radius:8px;cursor:pointer}
.modal-body{padding:20px}
/* FIXED DROPZONE - AB SAHI HAI */
.dropzone{border:2px dashed #cbd5e1;border-radius:12px;padding:28px 16px;text-align:center;background:#f8fafc;cursor:pointer;display:block;width:100%}
.dropzone p{font-size:14px;font-weight:600;margin-top:8px}
.dropzone small{font-size:12px;color:#64748b;display:block;margin-top:6px;line-height:1.4}
.file-list{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.file-item{background:#f1f5f9;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;font-size:13px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
.btn-primary{background:#6366f1;color:#fff;width:100%;margin-top:16px}
.actions{display:flex;gap:10px;margin-top:16px}
</style>
</head>
<body>
<header><div class="logo">📄 PDF<span>Play</span></div><div style="font-size:12px;color:#64748b">100% Private • No Upload</div></header>
<div class="marquee"><span>🔒 NO UPLOAD TO SERVER — ALL PROCESSING IN YOUR BROWSER • FAST • SECURE • FREE FOREVER • </span></div>
<div class="container"><div class="hero"><h1>Every PDF tool you need, <span class="grad">in your browser.</span></h1></div><div class="grid" id="toolGrid"></div></div>
<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle">Merge PDF</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()"><div style="font-size:32px">📁</div><p>Drop files here or click to browse</p><small>Add PDFs, reorder them, then merge locally. Nothing is uploaded.</small><input type="file" id="fileInput" accept=".pdf" multiple hidden></div><div class="file-list" id="fileList"></div><div class="actions"><button class="btn" style="background:#f1f5f9;flex:1" onclick="clearFiles()">Clear</button><button class="btn" style="background:#f1f5f9;flex:1" onclick="document.getElementById('fileInput').click()">Add More</button></div><button class="btn btn-primary" id="actionBtn" disabled>Merge PDFs → Download</button></div></div></div>
<script>
const tools=[{title:"Merge PDF",desc:"Combine multiple PDFs.",icon:"🔗",color:"#eef2ff"},{title:"Split PDF",desc:"Separate PDF pages.",icon:"✂️",color:"#fef3c7"},{title:"Compress PDF",desc:"Reduce PDF size.",icon:"🗜️",color:"#dcfce7"},{title:"Rotate PDF",desc:"Rotate pages.",icon:"🔄",color:"#f3e8ff"},{title:"Delete Pages",desc:"Remove pages.",icon:"🗑️",color:"#ffe4e6"},{title:"Extract Pages",desc:"Extract pages.",icon:"📑",color:"#e0f2fe"},{title:"Images to PDF",desc:"JPG/PNG to PDF.",icon:"🖼️",color:"#ffedd5"},{title:"PDF to Images",desc:"PDF to JPG/PNG.",icon:"🎞️",color:"#ecfdf5"},{title:"Add Page Numbers",desc:"Insert numbers.",icon:"#️⃣",color:"#f5f3ff"},{title:"Watermark PDF",desc:"Add watermark.",icon:"💧",color:"#e0f2fe"},{title:"Unlock PDF",desc:"Remove password.",icon:"🔓",color:"#fef9c3"},{title:"Protect PDF",desc:"Add password.",icon:"🔒",color:"#fce7f3"},{title:"Organize PDF",desc:"Reorder pages.",icon:"↕️",color:"#f1f5f9"},{title:"Repair PDF",desc:"Fix corrupted.",icon:"🛠️",color:"#ffedd5"},{title:"OCR PDF",desc:"Make searchable.",icon:"🔍",color:"#e0e7ff"},{title:"Edit Metadata",desc:"Edit title/author.",icon:"✏️",color:"#dcfce7"}];
let files=[];const grid=document.getElementById('toolGrid');tools.forEach(t=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="icon" style="background:${t.color}">${t.icon}</div><h3>${t.title}</h3><p>${t.desc}</p>`;c.onclick=()=>{document.getElementById('modalTitle').innerText=t.title;document.getElementById('modal').classList.add('active')};grid.appendChild(c);});
function closeModal(){document.getElementById('modal').classList.remove('active')}document.getElementById('fileInput').addEventListener('change',e=>{files=[...e.target.files];render()});function render(){const l=document.getElementById('fileList');l.innerHTML='';files.forEach((f,i)=>{l.innerHTML+=`<div class="file-item"><span>📄 ${f.name}</span><span onclick="files.splice(${i},1);render()" style="cursor:pointer">❌</span></div>`});document.getElementById('actionBtn').disabled=files.length==0}function clearFiles(){files=[];render()}
</script>
</body>
</html>
